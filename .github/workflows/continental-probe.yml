name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fast Postman README extraction
        shell: bash
        run: |
          python3 -c "import re,urllib.request;u='https://www.postman.com/continental-devteam/workspace/continental-devteam/document/fa787ab6-00be-4a28-ba90-7822883a55c8';r=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'});s=urllib.request.urlopen(r,timeout=20).read().decode('utf-8','ignore');print('SIZE',len(s));need=['fa787ab6-00be-4a28-ba90-7822883a55c8','WORKSPACE-README','VM_CONCIERGE_IP','runner','activation','Artifacts','winston','metadata','169.254.169.254'];[(print('\\n###',n),[print(s[max(0,i-400):i+1400].replace('\\\\n',' ')[:1800]) for i in [m.start() for m in list(re.finditer(re.escape(n),s,re.I))[:5]]]) for n in need];print('IPS',sorted(set(re.findall(r'(?<!\\\\d)(?:\\\\d{1,3}\\\\.){3}\\\\d{1,3}(?!\\\\d)',s)))[:100])"
