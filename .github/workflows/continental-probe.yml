name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate Postman collections by ID
        shell: bash
        run: |
          set -e
          for cid in             '54600970-4edc63a9-1623-4304-8ad5-c6e0662b6452'             '54600970-62f5e9dc-0019-4cf5-bf1b-78ba287412d2'; do
            echo "===== COLLECTION $cid ====="
            curl -fsS -X POST 'https://api.postman.com/search?limit=25'               -H 'Content-Type: application/json'               --data "$(jq -nc --arg cid "$cid" '{
                elementType:"requests",
                ownership:"all",
                filters:{"$and":[
                  {"visibility":{"$eq":"public"}},
                  {"collectionId":{"$eq":$cid}}
                ]}
              }')" |
              jq '{meta, data:[.data[]? | {id,name,method,url,description,collection,workspace,links}]}'
          done
