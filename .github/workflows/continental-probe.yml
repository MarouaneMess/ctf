name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump matching Postman requests
        shell: bash
        run: |
          set +e
          S='https://api.postman.com/search?limit=100'
          for q in thecontinental winston notification notifications activation deployment metadata concierge; do
            echo "===== $q ====="
            curl -sS -X POST "$S" -H 'Content-Type: application/json'               --data "$(jq -nc --arg q "$q" '{elementType:"requests",q:$q,ownership:"all",filters:{"$and":[{"visibility":{"$eq":"public"}}]}}')" |
              jq -r '.data[]? | select((.collection.id//"")|startswith("54600970-")) |
                [.name,.method,.url,.description,.id,.collection.id,.collection.name,.workspace.name] | @tsv'
          done
