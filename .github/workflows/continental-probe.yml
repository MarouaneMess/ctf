name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Postman README
        shell: bash
        run: |
          U='https://www.postman.com/continental-devteam/workspace/continental-devteam/document/fa787ab6-00be-4a28-ba90-7822883a55c8'
          curl -LskS "$U" -o /tmp/p.html
          echo "SIZE $(wc -c </tmp/p.html)"
          for needle in 'fa787ab6-00be-4a28-ba90-7822883a55c8' 'WORKSPACE-README' 'VM_CONCIERGE_IP' 'concierge' 'runner' 'activation' 'Artifacts' 'winston' 'metadata' '169.254.169.254'; do
            echo "===== ${needle} ====="
            grep -aoiE ".{0,160}${needle}.{0,700}" /tmp/p.html | head -n 12 || true
          done
          echo '===== IPS ====='
          grep -aoE '([0-9]{1,3}\.){3}[0-9]{1,3}' /tmp/p.html | sort -u | head -n 100 || true
