name: continental-probe
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Postman public API search
        shell: bash
        run: |
          set +e
          search() {
            typ="$1"; q="$2"
            echo "===== $typ :: $q ====="
            curl -sS -X POST 'https://api.postman.com/search?limit=25'               -H 'Content-Type: application/json'               --data "$(jq -nc --arg t "$typ" --arg q "$q" '{elementType:$t,q:$q,ownership:"all",filters:{"$and":[{"visibility":{"$eq":"public"}}]}}')"               | jq .
          }
          search collections 'the-continental-api'
          search collections 'continental'
          search workspaces 'continental-devteam'
          search workspaces 'continental'
          search requests 'thecontinental'
          search requests 'continental-reservations'
