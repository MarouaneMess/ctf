name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Raw Postman request hits
        shell: bash
        run: |
          set +e
          for q in thecontinental notification activation deployment metadata; do
            echo "===== $q ====="
            curl -sS -X POST 'https://api.postman.com/search?limit=100' -H 'Content-Type: application/json'               --data "$(jq -nc --arg q "$q" '{elementType:"requests",q:$q,ownership:"all",filters:{"$and":[{"visibility":{"$eq":"public"}}]}}')" |
              jq -c '.data[]? | {name,method,url,description,id,collection,workspace,createdBy}' |
              grep -Ei '54600970|continental-devteam|thecontinental.azurewebsites.net|VM_CONCIERGE_IP|ztaha45' || true
          done
