name: continental-probe
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e
          echo "===== DNS ====="
          getent ahostsv4 thecontinental.azurewebsites.net || true
          getent ahostsv4 thecontinental.scm.azurewebsites.net || true

          echo "===== ROOT ====="
          curl -skS -D /tmp/root.headers -o /tmp/root.html https://thecontinental.azurewebsites.net/
          cat /tmp/root.headers
          sed -n '1,320p' /tmp/root.html

          echo "===== LINKS ====="
          grep -Eo '(src|href|action)="[^"]+"' /tmp/root.html || true

          echo "===== COMMON PATHS ====="
          for p in robots.txt .git/HEAD .env api/ .auth/me web.config Dockerfile docker-compose.yml; do
            echo "===== /$p ====="
            curl -skS -i --max-time 10 "https://thecontinental.azurewebsites.net/$p" | head -n 120
          done

          echo "===== SCM ROOT ====="
          curl -skS -i --max-time 15 https://thecontinental.scm.azurewebsites.net/ | head -n 180

          echo "===== SCM COMMON ====="
          for p in api/settings api/environment api/deployments Env; do
            echo "===== SCM /$p ====="
            curl -skS -i --max-time 10 "https://thecontinental.scm.azurewebsites.net/$p" | head -n 120
          done

          echo "===== DOCKER USERS ====="
          for u in silvercryptor henryavery490; do
            echo "===== USER $u ====="
            curl -fsSL "https://hub.docker.com/v2/repositories/$u/?page_size=100" | jq -r '.results[] | [.namespace,.name,.is_private,.last_updated] | @tsv' || true
          done

          echo "===== DOCKER SEARCH ====="
          for q in thecontinental the-continental continental johnwick john-wick babayaga high-table; do
            echo "===== SEARCH $q ====="
            curl -fsSLG 'https://hub.docker.com/v2/search/repositories/' --data-urlencode "query=$q" --data 'page_size=100' | jq -r '.results[] | [.repo_name,.short_description,.last_updated] | @tsv' || true
          done
