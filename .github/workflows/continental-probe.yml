name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Postman document network
        shell: bash
        run: |
          which google-chrome || which chromium || true
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'https://www.postman.com/continental-devteam/workspace/continental-devteam/document/fa787ab6-00be-4a28-ba90-7822883a55c8' > /tmp/dom.html 2>/tmp/chrome.err || true
          echo '===== DOM SIZE ====='
          wc -c /tmp/dom.html
          echo '===== DOM INTERESTING ====='
          grep -aoiE '.{0,180}(WORKSPACE-README|VM_CONCIERGE_IP|concierge|activation|runner|Artifacts|winston|metadata|169\.254\.169\.254).{0,1000}' /tmp/dom.html | head -n 100 || true
          echo '===== IPS ====='
          grep -aoE '([0-9]{1,3}\.){3}[0-9]{1,3}' /tmp/dom.html | sort -u | head -n 100 || true
          echo '===== ERR ====='
          tail -n 60 /tmp/chrome.err || true
