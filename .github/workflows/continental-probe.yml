name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Postman env/request search
        shell: bash
        run: |
          set +e
          S='https://api.postman.com/search?limit=100'
          for typ in environments requests; do
            for q in continental 'The Continental' health upstream notifications activation deploy code VM_CONCIERGE_IP; do
              echo "===== $typ :: $q ====="
              curl -sS -X POST "$S" -H 'Content-Type: application/json'                 --data "$(jq -nc --arg t "$typ" --arg q "$q" '{elementType:$t,q:$q,ownership:"all",filters:{"$and":[{"visibility":{"$eq":"public"}}]}}')" |
                jq -r '.data[]? | [
                  (.name//""),(.id//""),(.method//""),(.url//""),(.description//""),
                  (.workspace.name//""),(.workspace.id//""),(.collection.name//""),(.collection.id//"")
                ] | @tsv' | grep -iE 'continental|54600970|7e7f4b2d' | head -n 40
            done
          done
