name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate Postman workspace assets
        shell: bash
        run: |
          set -e
          WS='7e7f4b2d-192c-45b9-b1b5-a082983fd1c4'
          for typ in environments collections mocks flows specs documents; do
            echo "===== $typ ====="
            curl -fsS -X POST 'https://api.postman.com/search?limit=25'               -H 'Content-Type: application/json'               --data "$(jq -nc --arg typ "$typ" --arg ws "$WS" '{
                elementType:$typ,
                ownership:"all",
                filters:{"$and":[
                  {"visibility":{"$eq":"public"}},
                  {"workspaceId":{"$eq":$ws}}
                ]}
              }')" | jq .
          done
