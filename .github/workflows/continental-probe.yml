name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe notification endpoint
        shell: bash
        run: |
          set +e
          echo '===== POSTMAN REQUEST SELF ====='
          curl -skS -i             'https://api.postman.com/collections/54600970-62f5e9dc-0019-4cf5-bf1b-78ba287412d2/requests/54600970-e22d56b7-7787-4af1-b15f-737ba15c6e08' |
            head -c 12000
          echo
          B='https://thecontinental.azurewebsites.net/v2/notify/send'
          for body in             '{}'             '{"to":"winston@ztaha45hotmail.onmicrosoft.com"}'             '{"recipient":"winston@ztaha45hotmail.onmicrosoft.com"}'             '{"email":"winston@ztaha45hotmail.onmicrosoft.com"}'             '{"to":"winston@ztaha45hotmail.onmicrosoft.com","subject":"test","body":"test"}'             '{"recipient":"winston@ztaha45hotmail.onmicrosoft.com","type":"activation"}'; do
              echo "===== BODY $body ====="
              curl -skS -i -X POST "$B" -H 'Content-Type: application/json' -d "$body" | head -n 100
          done
          echo '===== OPTIONS ====='
          curl -skS -i -X OPTIONS "$B" | head -n 60
