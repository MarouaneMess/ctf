name: continental-probe
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Focused probe
        shell: bash
        run: |
          set +e
          echo "===== APP.JS ====="
          curl -skS https://thecontinental.azurewebsites.net/static/app.js
          echo
          echo "===== STYLE interesting refs ====="
          curl -skS https://thecontinental.azurewebsites.net/static/style.css | grep -Ei 'url\(|comment|source|api|secret|docker|azure' || true
          echo
          echo "===== DOCKER USER silvercryptor ====="
          curl -fsSL 'https://hub.docker.com/v2/repositories/silvercryptor/?page_size=100' | jq -r '.results[] | [.namespace,.name,.is_private,.last_updated,.description] | @tsv'
          echo
          echo "===== DOCKER USER henryavery490 ====="
          curl -fsSL 'https://hub.docker.com/v2/repositories/henryavery490/?page_size=100' | jq -r '.results[] | [.namespace,.name,.is_private,.last_updated,.description] | @tsv'
          echo
          echo "===== TARGETED ROUTES ====="
          for p in reserve reservation reservations api/reserve api/reservation api/reservations book booking health debug console admin; do
            code=$(curl -skS -o /tmp/x -w '%{http_code}' "https://thecontinental.azurewebsites.net/$p")
            bytes=$(wc -c </tmp/x)
            printf '%-24s %s %s\n' "/$p" "$code" "$bytes"
          done
          echo
          echo "===== OPTIONS ROOT ====="
          curl -skS -i -X OPTIONS https://thecontinental.azurewebsites.net/ | head -n 30
