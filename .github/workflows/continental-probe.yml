name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Extract Bifrost HTTP2 paths
        shell: bash
        run: |
          python3 -c 'import re,subprocess;U='"'"'https://www.postman.com/continental-devteam/workspace/continental-devteam/document/fa787ab6-00be-4a28-ba90-7822883a55c8'"'"';subprocess.run(['"'"'timeout'"'"','"'"'14s'"'"','"'"'google-chrome'"'"','"'"'--headless=new'"'"','"'"'--no-sandbox'"'"','"'"'--disable-gpu'"'"','"'"'--disable-dev-shm-usage'"'"','"'"'--virtual-time-budget=6000'"'"','"'"'--log-net-log=/tmp/n'"'"','"'"'--net-log-capture-mode=IncludeSensitive'"'"','"'"'--dump-dom'"'"',U],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);s=open('"'"'/tmp/n'"'"','"'"'r'"'"',errors='"'"'ignore'"'"').read();print('"'"'AUTHORITY EVENTS'"'"');[print(s[max(0,m.start()-500):m.start()+4000].replace('"'"'\\n'"'"','"'"' '"'"')[:4500]) for m in list(re.finditer(r'"'"':authority: bifrost'"'"',s,re.I))[:80]];print('"'"'ALL UNIQUE H2 PATHS'"'"');[print(x) for x in sorted(set(re.findall(r'"'"':path: ([^"\\\r\n]+)'"'"',s)))][:500]'
