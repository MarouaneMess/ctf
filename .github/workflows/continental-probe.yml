name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read workspace README
        shell: bash
        run: |
          set +e
          ID='fa787ab6-00be-4a28-ba90-7822883a55c8'
          for u in             "https://api.postman.com/docs/$ID"             "https://go.postman.co/doc/$ID"             "https://www.postman.com/continental-devteam/workspace/continental-devteam/document/$ID"; do
            echo "===== $u ====="
            curl -LskS -D /tmp/h -o /tmp/b --max-time 20 "$u"
            head -n 30 /tmp/h
            echo "--- BODY ---"
            head -c 30000 /tmp/b
            echo
          done
