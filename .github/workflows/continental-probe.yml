name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Regex Postman netlog
        shell: bash
        run: |
          python3 -c 'import re,subprocess;U='"'"'https://www.postman.com/continental-devteam/workspace/continental-devteam/document/fa787ab6-00be-4a28-ba90-7822883a55c8'"'"';subprocess.run(['"'"'timeout'"'"','"'"'16s'"'"','"'"'google-chrome'"'"','"'"'--headless=new'"'"','"'"'--no-sandbox'"'"','"'"'--disable-gpu'"'"','"'"'--disable-dev-shm-usage'"'"','"'"'--virtual-time-budget=7000'"'"','"'"'--log-net-log=/tmp/netlog.json'"'"','"'"'--net-log-capture-mode=IncludeSensitive'"'"','"'"'--dump-dom'"'"',U],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);s=open('"'"'/tmp/netlog.json'"'"','"'"'r'"'"',errors='"'"'ignore'"'"').read();print('"'"'SIZE'"'"',len(s));print('"'"'URLS'"'"');[print(x) for x in sorted(set(re.findall(r'"'"'https://(?:bifrost[^"\\ ]+|www\.postman\.com/_api/[^"\\ ]+)'"'"',s,re.I)))];print('"'"'PATHS'"'"');[print(x) for x in sorted(set(re.findall(r'"'"':path: ([^"\\\r\n]+)'"'"',s))) if any(k in x.lower() for k in ['"'"'doc'"'"','"'"'workspace'"'"','"'"'entity'"'"','"'"'bifrost'"'"','"'"'bootstrap'"'"','"'"'sync'"'"'])];print('"'"'BIFROST_CONTEXT'"'"');[print(s[max(0,m.start()-600):m.start()+2400].replace('"'"'\\n'"'"','"'"' '"'"')[:3000]) for m in list(re.finditer('"'"'bifrost'"'"',s,re.I))[:40]];print('"'"'DOC_CONTEXT'"'"');[print(s[max(0,m.start()-600):m.start()+3000].replace('"'"'\\n'"'"','"'"' '"'"')[:3600]) for m in list(re.finditer('"'"'fa787ab6'"'"',s,re.I))[:30]]'
