name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract Bifrost document traffic
        shell: bash
        run: |
          python3 -c "import json,subprocess,os,time\nU='https://www.postman.com/continental-devteam/workspace/continental-devteam/document/fa787ab6-00be-4a28-ba90-7822883a55c8'\nsubprocess.run(['timeout','20s','google-chrome','--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--virtual-time-budget=8000','--log-net-log=/tmp/netlog.json','--net-log-capture-mode=IncludeSensitive','--dump-dom',U],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)\nd=json.load(open('/tmp/netlog.json'))\nfor e in d.get('events',[]):\n    p=e.get('params',{})\n    s=json.dumps(p,separators=(',',':'))\n    sl=s.lower()\n    if ('bifrost' in sl or 'fa787ab6' in sl or 'workspace-readme' in sl or '/document' in sl) and len(s)<20000:\n        print('TYPE',e.get('type'),'SOURCE',e.get('source'))\n        print(s[:12000])\n"
