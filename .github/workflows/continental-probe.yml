name: continental-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract Bifrost document traffic
        shell: bash
        run: |
          python3 -c 'import json,subprocess;U='"'"'https://www.postman.com/continental-devteam/workspace/continental-devteam/document/fa787ab6-00be-4a28-ba90-7822883a55c8'"'"';subprocess.run(['"'"'timeout'"'"','"'"'20s'"'"','"'"'google-chrome'"'"','"'"'--headless=new'"'"','"'"'--no-sandbox'"'"','"'"'--disable-gpu'"'"','"'"'--disable-dev-shm-usage'"'"','"'"'--virtual-time-budget=8000'"'"','"'"'--log-net-log=/tmp/netlog.json'"'"','"'"'--net-log-capture-mode=IncludeSensitive'"'"','"'"'--dump-dom'"'"',U],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);d=json.load(open('"'"'/tmp/netlog.json'"'"'));[(print('"'"'TYPE'"'"',e.get('"'"'type'"'"'),'"'"'SOURCE'"'"',e.get('"'"'source'"'"')),print(json.dumps(e.get('"'"'params'"'"',{}),separators=('"'"','"'"','"'"':'"'"'))[:12000])) for e in d.get('"'"'events'"'"',[]) if any(x in json.dumps(e.get('"'"'params'"'"',{})).lower() for x in ['"'"'bifrost'"'"','"'"'fa787ab6'"'"','"'"'workspace-readme'"'"','"'"'/document'"'"']) and len(json.dumps(e.get('"'"'params'"'"',{})))<20000]'
