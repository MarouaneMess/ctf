name: continental-probe
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API and Postman probe
        shell: bash
        run: |
          set +e
          base='https://thecontinental.azurewebsites.net'
          echo "===== API RESPONSES ====="
          for p in api/status api/rooms api/v2/status api/v2/rooms api/v2 api/v2/ api/docs api/v2/docs api/openapi.json api/v2/openapi.json swagger swagger.json api/swagger.json api/v2/swagger.json; do
            echo "===== /$p ====="
            curl -skS -i --max-time 10 "$base/$p" | head -n 80
          done

          echo "===== API METHODS ====="
          for p in api/status api/rooms api/v2/status api/v2/rooms; do
            echo "--- /$p"
            curl -skS -i -X OPTIONS "$base/$p" | head -n 25
          done

          echo "===== POSTMAN URL PROBES ====="
          for u in             'https://www.postman.com/continental-devteam'             'https://www.postman.com/continental-devteam/workspace/continental-devteam'             'https://www.postman.com/search?q=the-continental-api'             'https://www.postman.com/search?q=continental-devteam'; do
            echo "===== $u ====="
            curl -LskS -o /tmp/p -D /tmp/h --max-time 15 "$u"
            head -n 12 /tmp/h
            grep -Eio '.{0,100}(the-continental-api|continental-devteam|workspace|collection).{0,180}' /tmp/p | head -n 20 || true
          done
